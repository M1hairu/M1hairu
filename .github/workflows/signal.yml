name: signal

# Re-renders the profile SVGs from live contribution data once a day, so the
# numbers baked into the image never drift from the graph above it.

on:
  schedule:
    - cron: "17 3 * * *"      # 03:17 UTC daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/signal.yml"

permissions:
  contents: write

concurrency:
  group: signal
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The repo token is enough here: this profile publishes private
      # contributions, so the calendar it sees matches the graph visitors see
      # (verified — anonymous public calendar and the bot both report 321/44,
      # while a personal token reports 320/41 off a slightly different window).
      # GH_PAT is only needed if private contributions are ever hidden again.
      - name: Fetch contributions
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python tools/fetch_contributions.py

      - name: Render SVG
        env:
          CONTRIB_JSON: ${{ github.workspace }}/contrib.json
          SVG_OUT: ${{ github.workspace }}/.assets
        # boot.svg carries the contribution count too, so it re-renders with
        # the heatmap; signals.svg is static but stays in one command.
        run: python tools/render.py ${{ vars.SIGNAL_VARIANTS || 'waterfall boot signals' }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .assets
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "signal: refresh from $(date -u +%Y-%m-%d)"
            git push
          fi
