<g class="row" style="animation-delay:2.00s"><text x="38" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#555555" letter-spacing="0.12em" text-anchor="start" font-weight="400" opacity="1.0">reply from</text><text x="130" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#f5f5f5" letter-spacing="0.14em" text-anchor="start" font-weight="400" opacity="1.0">mihail.antsev@gmail.com</text><text x="560" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#555555" letter-spacing="0.14em" text-anchor="start" font-weight="400" opacity="1.0">seq=3</text><text x="648" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#9a9a9a" letter-spacing="0.14em" text-anchor="start" font-weight="400" opacity="1.0">state=OPEN</text><path d="M836 147 A 7 7 0 0 1 836 161" fill="none" stroke="#f5f5f5" stroke-width="1.1" opacity="0.55" class="arc" style="animation-delay:2.00s"/><path d="M836 142 A 12 12 0 0 1 836 166" fill="none" stroke="#f5f5f5" stroke-width="1.1" opacity="0.42" class="arc" style="animation-delay:2.12s"/><path d="M836 137 A 17 17 0 0 1 836 171" fill="none" stroke="#f5f5f5" stroke-width="1.1" opacity="0.29" class="arc" style="animation-delay:2.24s"/><circle cx="834" cy="154" r="2.4" fill="#f5f5f5"/></g>
<line x1="38" y1="180" x2="882" y2="180" stroke="#1a1a1a"/>
<g class="row" style="animation-delay:2.85s"><text x="38" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#555555" letter-spacing="0.14em" text-anchor="start" font-weight="400" opacity="1.0">--- ./out ping statistics ---</text><text x="38" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#9a9a9a" letter-spacing="0.14em" text-anchor="start" font-weight="400" opacity="1.0">3 packets transmitted, 3 received, 0% packet loss</text></g>
<rect x="38" y="242" width="6" height="11" fill="#f5f5f5" class="blink"/>
<text x="52" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#f5f5f5" letter-spacing="0.24em" text-anchor="start" font-weight="400" opacity="1.0">[ SIGNAL REMAINS UNSTABLE ]</text>
  <rect width="920" height="266" fill="url(#scanlines)" opacity="0.35" pointer-events="none"/>
</svg>
