<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="M1X — code meets movement">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .disk { animation: spin 18s linear infinite; transform-origin: 690px 120px; }
      .disk2 { animation: spin 26s linear infinite reverse; transform-origin: 690px 120px; }
      .scan { animation: drift 7s linear infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .glow { animation: pulse 4.5s ease-in-out infinite; }
      .flick { animation: flick 6s steps(1) infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes drift { from { transform: translateY(0); } to { transform: translateY(8px); } }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .7; } }
      @keyframes flick { 0%,97% { opacity: 1; } 97.5% { opacity: .72; } 98%,100% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .disk, .disk2, .scan, .cursor, .glow, .flick { animation: none; }
      }
    </style>

    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="78%" stop-color="#111" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#111" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#111" stop-opacity=".05"/>
      <stop offset="28%"  stop-color="#111" stop-opacity=".9"/>
      <stop offset="52%"  stop-color="#111" stop-opacity=".3"/>
      <stop offset="78%"  stop-color="#111" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#111" stop-opacity=".05"/>
    </linearGradient>

    <pattern id="dither" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#000"/>
      <rect width="1" height="1" fill="#fff" opacity=".6"/>
      <rect x="2" y="2" width="1" height="1" fill="#fff" opacity=".3"/>
    </pattern>
    <mask id="ditherMask">
      <rect width="900" height="240" fill="url(#dither)"/>
    </mask>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#111" opacity=".05"/>
    </pattern>

    <clipPath id="frame"><rect width="900" height="240"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <g class="glow"><circle cx="690" cy="120" r="150" fill="url(#halo)"/></g>

    <g mask="url(#ditherMask)">
      <g class="disk">
        <ellipse cx="690" cy="120" rx="132" ry="34" fill="none" stroke="url(#ring)" stroke-width="15"/>
      </g>
      <g class="disk2">
        <ellipse cx="690" cy="120" rx="108" ry="21" fill="none" stroke="url(#ring)" stroke-width="7"/>
      </g>
    </g>

    <circle cx="690" cy="120" r="47" fill="#111"/>
    <circle cx="690" cy="120" r="47" fill="none" stroke="#111" stroke-opacity=".9" stroke-width="1.1"/>
    <circle cx="690" cy="120" r="63" fill="none" stroke="#111" stroke-opacity=".2" stroke-width=".8"/>

    <g class="flick">
      <text class="mono" x="48" y="128" font-size="96" font-weight="700" letter-spacing="6" fill="#111">M1X</text>
      <rect class="cursor" x="252" y="52" width="15" height="88" fill="#111"/>
    </g>

    <text class="mono" x="52" y="170" font-size="15.5" letter-spacing="3.4" fill="#6b6b6b">CODE MEETS MOVEMENT</text>
    <text class="mono" x="52" y="194" font-size="15.5" letter-spacing="3.4" fill="#6b6b6b">PROFILE AS TRANSMISSION</text>

    <line x1="52" y1="212" x2="430" y2="212" stroke="#111" stroke-opacity=".22" stroke-width="1"/>

    <g class="scan"><rect x="0" y="-8" width="900" height="256" fill="url(#scanlines)"/></g>
    <rect width="900" height="240" fill="none" stroke="#111" stroke-opacity=".14" stroke-width="1"/>
  </g>
</svg>
